# Which launcher start-production.sh runs as the systemd production engine.
# Exactly one non-comment line: a launcher filename in scripts/.
#
#   start-llama-flashnext.sh             — Flash-Next 177B MoE IQ4_XS on llama.cpp:
#                                          262K ctx + vision + uncensored, ~109 tok/s
#                                          single-stream; weak at N>4 concurrency
#   start-vllm-flashnext-nvfp4-mtp.sh    — Flash-Next 177B NVFP4 + INT4 PLE
#                                          sidecar on vLLM, 262K ctx, no MTP:
#                                          615 agg @ N=16, 92 tok/s decode
#                                          single-stream. TEXT-ONLY, NOT
#                                          abliterated. MTP is 2x faster but
#                                          collapses ~1 run in 5 - see header.
#                                          NEEDS vm.overcommit_memory=1 (see
#                                          /etc/sysctl.d/99-vllm-ple-overcommit.conf)
#                                          and ~250s to /health.
#   start-vllm-38-27b-nvfp4.sh           — NVFP4 27B: agent-fleet engine (676 agg
#                                          @ N=16), TEXT-ONLY (no vision)
#   start-vllm-38-27b-fp8.sh             — FP8 27B: vision-capable, 2026-08-15 default
#   start-vllm-38-27b-uncensored-fp8.sh  — orcarouter abliterated FP8 27B (kept on
#                                          disk; ran as production 2026-08-22→23)
#
# To switch: change the line, then `sudo systemctl restart llama-server`.
# No daemon-reload or unit copy needed.
start-vllm-flashnext-nvfp4-mtp.sh
